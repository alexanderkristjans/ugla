name: Update calendar

on:
  schedule:
    - cron: "17 * * * *"   # every hour (UTC)
  workflow_dispatch:        # "Run workflow" button
  push:
    branches: [main]
    paths: ["rules.toml", "rewrite_ics.py"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}calendar.ics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rewrite calendar
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
        run: python rewrite_ics.py --output public/calendar.ics

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4

  # Keeps the hourly schedule from being disabled after 60 days of inactivity.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reset inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "03" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-calendar.yml/enable"
            echo "Workflow re-enabled; 60-day timer reset."
          else
            echo "Not the daily keepalive hour; skipping."
          fi
